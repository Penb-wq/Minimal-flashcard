<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <meta
      name="description"
      content="按章节学习的机械设计考研背诵闪卡"
    />
    <title>机械设计闪卡</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("mechanical-flashcards-theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="topline">
          <div class="brand-block" id="brand-block">
            <p class="eyebrow">MECHANICAL DESIGN</p>
            <h1>机械设计闪卡</h1>
          </div>

          <button class="back-button" id="back-button" type="button" hidden>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            返回目录
          </button>

          <button
            class="icon-button"
            type="button"
            data-theme-toggle
            aria-label="切换深色模式"
            title="切换深色模式"
          >
            <svg
              class="theme-icon theme-icon--sun"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg
              class="theme-icon theme-icon--moon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
          </button>
        </div>

        <div class="study-meta" id="study-meta" hidden>
          <h1 id="study-chapter-title"></h1>
          <div class="study-progress-row">
            <span id="study-progress-text">已掌握 0 / 总题数 0</span>
            <div
              class="study-progress-track"
              id="study-progress-track"
              role="progressbar"
              aria-label="本章已掌握进度"
              aria-valuemin="0"
              aria-valuemax="0"
              aria-valuenow="0"
            >
              <div class="study-progress-fill" id="study-progress-fill"></div>
            </div>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section class="view directory-view" id="directory-view">
          <div class="directory-heading">
            <h2>章节目录</h2>
            <span id="overall-progress">读取中</span>
          </div>

          <div class="chapter-list" id="chapter-list" aria-live="polite"></div>

          <div class="loading-state" id="loading-state" role="status">
            <div class="loading-mark" aria-hidden="true"></div>
            <span>正在加载章节</span>
          </div>

          <div class="error-state" id="error-state" hidden>
            <h2>章节数据加载失败</h2>
            <p id="error-message"></p>
            <button class="retry-button" id="retry-button" type="button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path>
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>
              </svg>
              重新加载
            </button>
          </div>
        </section>

        <section class="view study-view" id="study-view" hidden>
          <div class="study-area">
            <div class="card-stage" id="card-stage">
              <article
                class="flashcard"
                id="flashcard"
                role="button"
                tabindex="0"
                aria-label="翻转卡片"
                aria-pressed="false"
              >
                <section class="card-face card-front">
                  <span class="card-label">问题</span>
                  <p class="question-text" id="question-text"></p>
                  <span class="card-index" id="card-index"></span>
                </section>

                <section class="card-face card-back" id="card-back" aria-hidden="true">
                  <div class="answer-scroll">
                    <span class="card-label">答案</span>
                    <p class="answer-text" id="answer-text"></p>
                    <div class="keyword-row">
                      <span class="keyword-label">关键词</span>
                      <span class="keyword-value" id="keyword-value"></span>
                    </div>
                  </div>
                </section>
              </article>

              <section class="completion-panel" id="completion-panel" hidden>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="34"
                  height="34"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
                <p class="completion-title">本章完成</p>
                <p class="completion-copy" id="completion-copy"></p>
              </section>
            </div>

            <div class="action-area">
              <div class="action-buttons" id="action-buttons">
                <button
                  class="study-button study-button--danger"
                  id="forgot-button"
                  type="button"
                  disabled
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                  </svg>
                  没记住
                </button>
                <button
                  class="study-button study-button--success"
                  id="remember-button"
                  type="button"
                  disabled
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                  记住了
                </button>
              </div>

              <button class="restart-button" id="restart-button" type="button" hidden>
                重新开始本章
              </button>
            </div>
          </div>

          <footer class="app-footer">
            <span id="queue-status"></span>
          </footer>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
